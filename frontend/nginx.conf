# HTTP context (conf.d).
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chat_rate:10m rate=6r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    limit_req_status 429;
    limit_conn_status 429;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }
    location = /docs { return 404; }
    location = /openapi.json { return 404; }
    location = /redoc { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/chat/messages {
        limit_req zone=chat_rate burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=api_rate burst=5 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
